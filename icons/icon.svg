<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Link node motif — two interlocking circles with a connecting line -->
  <g transform="translate(256,256)">
    <!-- Connecting line -->
    <line x1="-80" y1="-40" x2="80" y2="40" stroke="#4DE08A" stroke-width="28" stroke-linecap="round"/>
    <!-- Node 1 -->
    <circle cx="-95" cy="-55" r="52" fill="none" stroke="#4DE08A" stroke-width="26"/>
    <!-- Node 1 inner dot -->
    <circle cx="-95" cy="-55" r="14" fill="#4DE08A"/>
    <!-- Node 2 -->
    <circle cx="95" cy="55" r="52" fill="#4DE08A" stroke="none"/>
    <!-- Node 2 inner cutout -->
    <circle cx="95" cy="55" r="12" fill="#1a1a1a"/>
  </g>
</svg>
