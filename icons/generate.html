<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkMemo Icon Generator</title>
<style>
  body {
    background: #141414;
    color: #eee;
    font-family: -apple-system, 'SF Pro Text', 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    gap: 24px;
  }
  h2 { font-weight: 600; letter-spacing: -0.02em; }
  .preview {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .preview-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .preview-item canvas {
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .preview-item span {
    font-size: 13px;
    color: #888;
  }
  button {
    padding: 10px 24px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #4DE08A;
    color: #141414;
    transition: all 0.15s ease;
  }
  button:hover { background: #6ae89f; }
  button:active { transform: scale(0.96); }
</style>
</head>
<body>

<h2>LinkMemo — App Icon Generator</h2>
<p style="color:#888;font-size:14px">下载后替换 icons/ 目录中的 icon-192.png 和 icon-512.png</p>

<div class="preview" id="preview"></div>

<script>
const SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <line x1="-80" y1="-40" x2="80" y2="40" stroke="#4DE08A" stroke-width="28" stroke-linecap="round"/>
    <circle cx="-95" cy="-55" r="52" fill="none" stroke="#4DE08A" stroke-width="26"/>
    <circle cx="-95" cy="-55" r="14" fill="#4DE08A"/>
    <circle cx="95" cy="55" r="52" fill="#4DE08A" stroke="none"/>
    <circle cx="95" cy="55" r="12" fill="#1a1a1a"/>
  </g>
</svg>`;

const SIZES = [
  { name: 'icon-192.png', w: 192, h: 192 },
  { name: 'icon-512.png', w: 512, h: 512 },
];

const preview = document.getElementById('preview');

SIZES.forEach(({ name, w, h }) => {
  const div = document.createElement('div');
  div.className = 'preview-item';

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  const img = new Image();
  const blob = new Blob([SVG], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);

    const btn = document.createElement('button');
    btn.textContent = '⬇ 下载 ' + name;
    btn.onclick = () => {
      canvas.toBlob(b => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = name;
        a.click();
      }, 'image/png');
    };
    div.appendChild(canvas);
    div.appendChild(document.createElement('span')).textContent = w + '×' + w;
    div.appendChild(btn);
  };
  img.src = url;
  preview.appendChild(div);
});
</script>

</body>
</html>
